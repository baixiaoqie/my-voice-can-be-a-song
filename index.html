<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="通过点击/触摸播放声音并出现变化图案的互动内容。">
  <title>我的声音也能成曲</title>
  <link rel="apple-touch-icon" href="icon.png">
  <!-- 样式加载顺序（层叠契约，勿调整）：
       1) shared/sp/css/common.css —— YUI 3.18.1 reset（第三方，不修改；
          其遗留的裸背景/链接色/全局 letter-spacing 由 design-system.css 第 2 章接管）
       2) css/utatap.css —— 原项目基础样式（同源层，回退底色）
       3) css/design-system.css —— 统一设计令牌与组件规范，必须晚于同源层 -->
  <link charset="UTF-8" href="shared/sp/css/common.css" rel="stylesheet">
  <link charset="utf-8" href="css/utatap.css" rel="stylesheet">
  <!-- 精整流程：统一视觉规范。必须晚于同源层加载，才能覆盖其裸色值 -->
  <link charset="utf-8" href="css/design-system.css" rel="stylesheet">
  <script charset="utf-8" src="assets/js/jquery-3.6.0.min.js" type="text/javascript"></script>
  <script charset="utf-8" src="assets/js/pixi-6.0.2.min.js" type="text/javascript"></script>
  <script charset="utf-8" src="assets/js/gsap-3.6.1.min.js" type="text/javascript"></script>
  <script charset="UTF-8" src="shared/js/common-2.min.js" type="text/javascript"></script>
  <script charset="utf-8" src="custom/js/storage.js" type="text/javascript"></script>
  <script charset="utf-8" src="js/voice-custom-bridge.js" type="text/javascript"></script>
  <!-- 模式二：像素首页。classic script，须在 main.js（module）之前就绪 -->
  <script charset="utf-8" src="js/pixel-core.js" type="text/javascript"></script>
  <script charset="utf-8" src="js/pixel-palette.js" type="text/javascript"></script>
  <script charset="utf-8" src="js/pixel-scene.js" type="text/javascript"></script>
  <script charset="utf-8" src="js/pixel-actors.js" type="text/javascript"></script>
  <script charset="utf-8" src="js/home-overlay.js" type="text/javascript"></script>
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <div id="view"></div>
  <div id="scene_top">
    <!-- 顶部导航栏：站名 + 返回首页 融合为同一元素（不再用独立浮层按钮） -->
    <nav id="topbar" aria-label="主导航">
      <a id="nav_home" href="javascript:void(0);" title="回到首页">
        <span class="nav-home__icon" aria-hidden="true"></span>
        <span class="nav-home__text">首页</span>
      </a>
      <h1 class="topbar__brand">我的声音也能成曲</h1>
    </nav>
    <div id="ng">
      <p class="atten">十分抱歉，<br>您的浏览器并不支持本页面需要的特性</p>
    </div>
    <div class="ok">
      <p id="bt_start"><a href="javascript:void(0);">! 开始 !</a></p>
    </div>
    <div class="ok">
      <p id="bt_select"><a href="javascript:void(0);">: 选择 :</a></p>
    </div>
    <div class="ok">
      <p id="bt_custom"><a href="custom/">: 自定义音频 :</a></p>
    </div>
    <p id="bt_about"><a href="javascript:void(0);">* 关于 *</a></p>
    <div class="ok">
      <p class="attention">※ 调高你的音量并享受吧！</p>
    </div>
  </div>
  <div id="scene_loading">
    <p>少女祈祷中</p>
    <!-- 原为 <hr size="1" color="#fff">：color 是表现性属性（等价内联样式），
         属 HTML 内联硬编码色值。#scene_loading hr 的边框与底色已由
         design-system.css 的 --track-bg / --radius-full 接管，
         该属性本就不可见，故移除以保证「HTML 内零硬编码色值」。 -->
    <hr> </div>
  <div id="scene_main">
    <div class="set">
      <p class="attention">点击 &amp; 拖动或者按任意键!</p>
      <p id="bt_feedback"><a href="javascript:void(0);">反馈: 开启</a></p>
      <p id="bt_backtrack"><a href="javascript:void(0);">背景音乐: 开启</a></p>
    </div>
  </div>
  <div id="select_cover"></div>
  <div id="select">
    <div id="select_in">
      <p class="close"><span id="bt_close">×</span></p>
      <div class="split">
        <div class="container_vocal">
          <p class="con">选择歌姬</p>
          <ul id="vocals"></ul>
          <hr class="custom_dash" />
          <div class="custom">
            <input type="file" id="file_vocal" title="从本地上传歌姬" accept=".json">
            <label for="file_vocal">*自定义*</label>
          </div>
        </div>
        <hr />
        <div class="container_tracks">
          <p class="con">选择背景音轨</p>
          <ul id="tracks"></ul>
          <hr class="custom_dash" />
          <div class="custom">
            <input type="file" id="file_music" title="从本地上传背景音轨" accept=".json">
            <label for="file_music">*自定义*</label>
          </div>
        </div>
      </div>
      <p>欢迎将你制作的歌姬与背景音轨文件贡献到 <a href="https://github.com/MrXiaoM/uta-tap/tree/main/data" target="_blank">Github 仓库</a>!</p>
      <p class="con">本地配置制作教程也在仓库哦~</p>
    </div>
  </div>
  <div id="about_cover"></div>
  <div id="about">
    <div id="about_in">
      <p class="close"><span id="bt_close">×</span></p>
      <p class="con"> 作者 <a href="https://github.com/baixiaoqie" target="_blank" rel="noopener noreferrer">白小锲</a> </p>
      <p class="con"> 想要点击开始后自动播放吗? 请在链接后加上 <code>?auto=1</code> </p>
    </div>
  </div>
  <!--
    #bt_back / #bt_fs 保留为空壳，仅供原项目 JS（main.js）做显隐与事件挂载，
    视觉与交互已并入顶部导航栏 #topbar > #nav_home，不再单独显示。
  -->
  <div id="bt_back" aria-hidden="true"></div>
  <div id="bt_fs" hidden>全屏显示</div>
</body>

</html>
